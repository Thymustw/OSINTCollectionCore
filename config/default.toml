# OSINT Intelligence Core — 預設設定（無密文）
# 環境變數覆寫：OSINT__<區段>__<鍵>，例如 OSINT__APP__ENVIRONMENT=dev
# 密鑰一律用 SecretRef（env: / file: / store:），不要把連線密碼寫進這個檔。

[app]
environment = "dev"

[storage.canonical]
adapter = "postgres"
dsn_secret_ref = "env:DATABASE_URL"
pool_max = 10

[storage.sqlite_local]
adapter = "sqlite"
path = "./var/osint-local.sqlite"
roles = ["embedded", "relational"]

[storage.search]
adapter = "opensearch"
url = "http://127.0.0.1:9200"

[storage.object]
adapter = "s3"
endpoint = "http://127.0.0.1:9000"
bucket = "raw-evidence"
access_key_ref = "env:MINIO_ROOT_USER"
secret_key_ref = "env:MINIO_ROOT_PASSWORD"

[storage.cache]
adapter = "redis"
url_secret_ref = "env:REDIS_URL"

# 圖投影（SPEC_V0.2 §8）。PostgreSQL 仍是 canonical truth，這裡是可重建的投影。
#
# http_url（7474）給 /api/v1/ops/health 的 HTTP 探活。空字串 = 未設定，
# /ops/health 會列進 not_configured 而不是 unhealthy。
# bolt_uri（7687）給 storage-neo4j 的 Neo4jStore；密碼只存 SecretRef，不要寫明文。
# pool_max 是 Bolt 連線池上限，傳給 Neo4jStore::connect；0 會被 adapter 拒絕。
# 容器內請用 OSINT__STORAGE__GRAPH__BOLT_URI=bolt://neo4j:7687 覆寫。
[storage.graph]
adapter = "neo4j"
http_url = "http://127.0.0.1:7474"
bolt_uri = "bolt://127.0.0.1:7687"
username = "neo4j"
password_secret_ref = "env:NEO4J_PASSWORD"
pool_max = 5

[broker]
brokers = "127.0.0.1:9092"

[http]
# 本工作站 8080 是 OpenCTI。osint-api 預設 18080，避免搶埠。
bind = "127.0.0.1:18080"
rate_limit_per_second = 20
request_body_limit_bytes = 1048576

[auth]
jwt_secret_ref = "env:JWT_SECRET"
jwt_issuer = "osint-core"
jwt_ttl_secs = 3600

[collector]
# 本工作站 8080 是 OpenCTI。collector health 預設 18081。
bind = "127.0.0.1:18081"
tick_secs = 5
global_inflight = 4
per_domain_inflight = 1

[normalizer]
bind = "127.0.0.1:18082"
consumer_group = "osint-normalizer"

[deduplicator]
bind = "127.0.0.1:18083"
consumer_group = "osint-deduplicator"
# SPEC §15 五階段的上限。三個都是硬上限，沒有「不限」：
# Stage 4（SimHash）沒有可走索引的等值條件，少了上限就是每份 Document 全表掃一次。
candidate_limit = 20
simhash_scan_limit = 500
# Hamming 距離門檻（64 bit 中最多差幾個 bit 才算近似重複）。
# 3 是 SimHash 論文與多數實務的慣用值；理由見 crates/deduplicator/src/simhash.rs。
simhash_max_distance = 3

[entity_worker]
bind = "127.0.0.1:18084"
consumer_group = "osint-entity-worker"
# SPEC §17 抽取的上限。兩個都是硬上限，沒有「不限」：
# 一篇塞滿 IOC 的傾印檔若不設限，單份 Document 就能產生上萬列 entity_extractions。
# 超過 max_extractions 會截斷並記 warn（不是靜默少抽）。
# 取捨與實測依據見 crates/entity-worker/src/extract.rs 的 ExtractionBounds。
max_extractions = 500
# 只掃描 title + summary + body 的前 N 個 byte（256 KiB）。
max_scan_bytes = 262144

[indexer]
bind = "127.0.0.1:18085"
consumer_group = "osint-indexer"
# OpenSearch index 名稱。前綴是刻意的：OPENSEARCH_URL 有可能被指到共用叢集，
# 叫 "documents" 太通用，撞名時是直接寫進別人的資料。
# 改名等於換一個空 index，改完要跑 `make rebuild-index`。
index = "osint-documents"
# SPEC §18 投影的上限。四個都是硬上限，沒有「不限」：
# indexer 是高吞吐消費者（CLAUDE.md §6），少了批次上限等於把整個 partition
# 的內容塞進一次 bulk 請求。
batch_size = 200
# 累積不到 batch_size 時最久等多久（毫秒）。設成 0 會讓低流量時最後幾筆
# **永遠不進 index**——看起來像「搜尋少了最新的文件」。
batch_timeout_ms = 1000
# 單一文字欄位（title／summary／body）寫進 index 的 byte 上限（256 KiB），
# 與 [entity_worker].max_scan_bytes 對齊。
max_field_bytes = 262144
# 暫時性 bulk 失敗（429／503）的重試次數。永久性失敗（400 mapping 不符）不重試。
bulk_max_retries = 3
# consumer lag 超過此值就在批次之間插入延遲，並把 lag 寫進 osint_queue_depth
# 讓上游採集端降速。設計理由見 crates/indexer/src/batch.rs。
lag_threshold = 5000
backpressure_sleep_ms = 200

[graph_worker]
# 18080–18085 已分別是 api／collector／normalizer／deduplicator／
# entity-worker／indexer 的 health 埠。
bind = "127.0.0.1:18086"
consumer_group = "osint-graph-worker"
# ProjectionStore 用的投影名稱。改名等於換一個空投影，要跑 rebuild。
projection = "osint-graph"
# rebuild 掃 canonical store 時每頁筆數。硬上限，沒有「不限」。
page_size = 100

[embedding_worker]
# 18080–18086 已分別是 api／collector／normalizer／deduplicator／
# entity-worker／indexer／graph-worker 的 health 埠。
bind = "127.0.0.1:18087"
consumer_group = "osint-embedding-worker"
# Entity 向量投影的 index。Document 向量仍寫進 [indexer].index。
# 改名等於換一個空投影，要跑 --rebuild。
entities_index = "osint-entities"
# rebuild 掃 canonical store 時每頁筆數。硬上限，沒有「不限」。
page_size = 100

[stix_worker]
# 18080–18087 已分別是 api／collector／normalizer／deduplicator／
# entity-worker／indexer／graph-worker／embedding-worker 的 health 埠。
bind = "127.0.0.1:18088"
consumer_group = "osint-stix-worker"
# 單次 stix_import 交易最多寫入幾筆已對應的 Entity。與 [stix].max_objects 對齊；
# 超過整批 Failed，不拆交易。硬上限，沒有「不限」。
max_objects_per_tx = 10000

[discovery_worker]
# 18080-18088 已分別是既有服務的 health 埠。
bind = "127.0.0.1:18089"
consumer_group = "osint-discovery-worker"

[import]
# POST /api/v1/import 的上限。跟 [http].request_body_limit_bytes 是兩條獨立界線：
# 一般 API body 維持 1 MiB，檔案上傳另外給 10 MiB，不放寬其他路由。
max_upload_bytes = 10485760
max_records = 10000
max_record_bytes = 262144
max_field_bytes = 65536
max_depth = 32
max_columns = 512

# STIX 2.1 匯入／匯出上限（POST /api/v1/import/stix、POST /api/v1/export/stix）。
# 跟 [http].request_body_limit_bytes 是兩條獨立界線：一般 API body 維持 1 MiB，
# STIX bundle 另外給 50 MiB，不放寬其他路由。
[stix]
max_bundle_bytes = 52428800
max_objects = 10000

# Embedding 產生參數（V0.2 Phase 3）。OpenSearch 連線沿用 [storage.search].url，
# 不要在這裡再放一份 URL。
[embedding]
# embed_batch 一次送幾筆給 ml-commons _predict。
batch_size = 32
# 同時進行中的推論請求數上限（bounded semaphore，CLAUDE.md §6）。
concurrent_inferences = 4
# Semantic dedup（deduplicator Stage 5）的 cosine 門檻。
# ⚠️ 這個值目前只有 deduplicator 在用。resolver 的 semantic_similarity
# 方法是獨立硬編碼的 SEMANTIC_SIMILARITY_THRESHOLD（0.85，見
# crates/resolver/src/service.rs），沒有讀這個欄位——兩者是兩個不同的
# 數字，不要假設改這裡 resolver 的行為會跟著變。
# ⚠️ 這不是校準過的數字。0.90 是 Phase 0 用一小組句子推論的暫定值，
# 從來沒有用真實 OSINT 語料驗證過。e5-small 不相關文字 baseline cosine
# 就有 ~0.83（embedding.md §5.1），跟 0.90 只差 0.07。
# Stage 5 現在會用這個數字自動把文件標成 duplicate——誤判的代價是下游
# 跳過那份文件。要改這個值，先用量測，不要靠感覺微調。
similarity_threshold = 0.90
# Stage 5 把當場算出的向量寫進 Redis 的 TTL（秒）。embedding-worker
# 在打 ml-commons 之前會先查這把 key。預設 15 分鐘；實際使用夾在 300..=3600。
dedup_cache_ttl_secs = 900

# Hybrid search（POST /search/hybrid，SPEC §15）的 RRF 權重。
# 權重是「這個訊號在 RRF 公式裡的比重」，不是原始分數的乘數。
# entity_match／recency／source_score／confidence 預設 0.0。
# V0.2 沒有實作這四個訊號（沒有排名清單），設非零只會在啟動時打 warning。
[search_hybrid]
bm25_weight = 1.0
vector_weight = 1.0
entity_match_weight = 0.0
recency_weight = 0.0
source_score_weight = 0.0
confidence_weight = 0.0

# AI 輔助自動核准（ADR-012）。預設完全關閉：enabled = false 時，
# resolver 行為與 ADR-012 之前完全一樣，所有候選維持 Pending。
# 這是對 CLAUDE.md §5「AI output cannot directly override policy/identity
# decisions」的刻意例外，細節見 docs/adr/ADR-012-ai-assisted-auto-approval.md。
# 門檻數字沒有用真實 OSINT 語料驗證過，生產環境打開前請先校準。
[auto_approval]
enabled = false
auto_confirm_score = 0.95
llm_review_score = 0.70
max_auto_merges_per_resolve = 3
survivor_strategy = "source"

[auto_approval.llm]
enabled = false
base_url = "http://ai-inference:8000/v1"
model = "qwen-primary"
model_version = "unknown"
timeout_secs = 30
max_retries = 0
max_concurrent = 2
max_tokens = 512
temperature = 0.0
