# 本機／共用工作站基礎建設 + 六個應用服務。正式資源上限在 docker-compose.dev.yml。
#
# 只起基礎建設（本機用 cargo run 跑服務）：
#   make compose-up
# 連應用服務一起起（全容器化）：
#   make compose-up-full
#
# 六個應用服務放在 `profiles: ["app"]` 底下，**預設不啟動**。這是刻意的：
# CI 的 integration-test job 與 `make compose-up` 都只要基礎建設，若應用服務
# 是預設啟動，那兩條路徑都會被迫先跑一次十幾分鐘的 image build。
# 要啟動它們必須明確加 `--profile app`。
#
# ---------------------------------------------------------------------------
# 容器內的連線設定跟本機 .env **不一樣**，不要混用
# ---------------------------------------------------------------------------
# 本機 .env 寫的是 127.0.0.1:19200 / 127.0.0.1:19000，而且設了
# OSINT_STRICT_PORT_ISOLATION=1 —— 那是為了避開這台工作站上 OpenCTI 佔用的
# 9200/9000，是**宿主端**的規避手段。
#
# 容器是走 compose network 的 DNS：opensearch:9200 / minio:9000 / postgres:5432。
# 那些埠在 network 內是本專案自己的服務，沒有任何衝突。所以應用服務：
#   1. **絕對不要**設 OSINT_STRICT_PORT_ISOLATION（設了會被
#      storage-core 的 verify_not_opencti_search 擋下來，錯誤訊息還會叫你改成
#      19200，那在容器內是錯的建議）。
#   2. **絕對不要** env_file: ../.env（同上，會把宿主專屬設定灌進來）。
# 對照表寫在 docs/developer/local-dev.md。
name: osint-core

networks:
  osint-core:
    name: osint-core-net

volumes:
  postgres-data:
  opensearch-data:
  redpanda-data:
  redis-data:
  minio-data:

# 六個應用服務共用的連線設定。全部指向 compose network 的服務名，不是 127.0.0.1。
x-osint-env: &osint-env
  # core-config 的 SecretRef `env:DATABASE_URL`（config/default.toml
  # [storage.canonical].dsn_secret_ref）。
  DATABASE_URL: postgres://${POSTGRES_USER:-osint}:${POSTGRES_PASSWORD:-osint_dev}@postgres:5432/${POSTGRES_DB:-osint_core}
  # OSINT__<區段>__<鍵> 覆寫 config/default.toml。巢狀鍵用雙底線。
  OSINT__STORAGE__SEARCH__URL: http://opensearch:9200
  OSINT__STORAGE__OBJECT__ENDPOINT: http://minio:9000
  # 29092 是 redpanda 的 internal listener（宣告成 redpanda:29092）。
  # **不要改成 9092**——那個 listener 宣告的是 127.0.0.1，容器連上去會變成
  # 連自己。理由與症狀見下方 redpanda 服務的註解。
  OSINT__BROKER__BROKERS: redpanda:29092
  REDIS_URL: redis://redis:6379/0
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-osint}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-osint_dev_minio}
  # JwtService 要求至少 32 個 ASCII byte，短了會直接啟動失敗。
  # ⚠️ 這個預設值只適用於本機／CI。正式佈署必須從 secret 管理機制帶入。
  JWT_SECRET: ${JWT_SECRET:-osint-dev-only-jwt-secret-32bytes-min}
  OSINT__APP__ENVIRONMENT: ${OSINT_ENVIRONMENT:-dev}
  RUST_LOG: ${RUST_LOG:-info,rdkafka=warn,librdkafka=warn}
  # 刻意**不設** OSINT_STRICT_PORT_ISOLATION：容器內的 opensearch:9200 /
  # minio:9000 是本專案自己的服務，不是宿主上的 OpenCTI。理由見檔頭。

# 全部依賴基礎建設就緒。六個服務啟動時都會各自跑一次 store.migrate()；
# 已確認 sqlx-core 0.9.0 的 Migrator 預設 `locking: true`
# （sqlx-core-0.9.0/src/migrate/migrator.rs:39），Postgres 端是 advisory lock，
# 所以同時啟動會序列化而不是互相踩踏——不需要額外的 one-shot migrate 服務。
x-osint-depends: &osint-depends
  postgres:
    condition: service_healthy
  opensearch:
    condition: service_healthy
  redpanda:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

x-osint-build: &osint-build
  context: ..
  dockerfile: docker/Dockerfile

services:
  postgres:
    image: postgres:17-bookworm
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osint_dev}
      POSTGRES_DB: ${POSTGRES_DB:-osint_core}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
      - -c
      - log_min_duration_statement=1000
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - osint-core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.6
    hostname: opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - osint-core
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    hostname: redpanda
    # 兩個 Kafka listener。**這不是可選的美化，少了它容器內的服務會靜默壞掉。**
    #
    # 2026-09-12 實測：`--mode dev-container` 單一 listener 時，broker 對外
    # 宣告的位址是 `127.0.0.1:9092`。宿主上的 `cargo run` 沒問題（127.0.0.1
    # 真的就是 broker），但容器內的服務拿到這個 metadata 之後會去連**自己**的
    # 127.0.0.1，得到 `AllBrokersDown ... MessageTimedOut`。
    #
    # 陰險的地方在於**這不會讓健康檢查變紅**：bootstrap 位址 `redpanda:9092`
    # 連得上，metadata 查得到（`/api/v1/ops/health` 回「1 個 broker、57 個
    # topic」一切正常），只有實際 produce/consume 會逾時。表現出來是
    # 「匯入回 201 但文件永遠不會出現在搜尋結果裡」。
    #
    #   external → 0.0.0.0:9092，宣告 127.0.0.1:9092  → 給宿主（cargo run、CI）
    #   internal → 0.0.0.0:29092，宣告 redpanda:29092 → 給 compose network 內的容器
    #
    # external 維持 9092 是刻意的：本機 .env、config/default.toml、CI 的
    # REDPANDA_BROKERS 全都指著 9092，換掉會波及整個測試套件。29092 不對宿主
    # 開放（沒有寫進 ports），只在 network 內用。
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --kafka-addr
      - internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:29092,external://127.0.0.1:9092
      - --smp
      - "1"
      - --memory
      - 256M
      - --overprovisioned
      - --default-log-level=info
    ports:
      - "9092:9092"
      - "8081:8081"
      - "8082:8082"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - osint-core
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -e | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-bookworm
    hostname: redis
    command:
      - redis-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - osint-core
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  minio:
    # 2026-09-11 實測 Docker Hub 的 minio/minio 已消失（hub.docker.com/r/minio/minio 回 404，
    # v2 API 查 repository 也是空的），CI 乾淨環境拉 image 直接失敗。同一個 tag 在 quay.io
    # 仍在（quay.io API 查得到），改指向 quay.io。本機因為有舊快取所以之前沒發現。
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    hostname: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-osint}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-osint_dev_minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - osint-core
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # =========================================================================
  # 應用服務（SPEC §27 exit criteria：docker compose 可啟動整套）
  # =========================================================================
  #
  # healthcheck 由 image 的 HEALTHCHECK 指令提供（docker/Dockerfile），
  # compose 直接沿用，不在這裡重複定義一份會慢慢跟 Dockerfile 走鐘的副本。
  #
  # 每個服務都必須把 bind 覆寫成 0.0.0.0：config/default.toml 的預設
  # 127.0.0.1 在容器內等於「只有容器自己連得到」，宿主與其他容器都打不到。
  #
  # 宿主埠沿用本機開發同一組 18080–18085，方便在容器版與 `cargo run` 版之間
  # 直接切換（兩者不能同時跑，會搶埠）。

  osint-api:
    build:
      <<: *osint-build
      target: osint-api
    image: osint-core/osint-api:0.1.0
    hostname: osint-api
    profiles: ["app"]
    environment:
      <<: *osint-env
      OSINT__HTTP__BIND: 0.0.0.0:18080
    ports:
      - "18080:18080"
    networks:
      - osint-core
    depends_on: *osint-depends
    restart: unless-stopped

  osint-collector:
    build:
      <<: *osint-build
      target: osint-collector
    image: osint-core/osint-collector:0.1.0
    hostname: osint-collector
    profiles: ["app"]
    environment:
      <<: *osint-env
      OSINT__COLLECTOR__BIND: 0.0.0.0:18081
    ports:
      - "18081:18081"
    networks:
      - osint-core
    depends_on: *osint-depends
    restart: unless-stopped

  osint-normalizer:
    build:
      <<: *osint-build
      target: osint-normalizer
    image: osint-core/osint-normalizer:0.1.0
    hostname: osint-normalizer
    profiles: ["app"]
    environment:
      <<: *osint-env
      OSINT__NORMALIZER__BIND: 0.0.0.0:18082
    ports:
      - "18082:18082"
    networks:
      - osint-core
    depends_on: *osint-depends
    restart: unless-stopped

  osint-deduplicator:
    build:
      <<: *osint-build
      target: osint-deduplicator
    image: osint-core/osint-deduplicator:0.1.0
    hostname: osint-deduplicator
    profiles: ["app"]
    environment:
      <<: *osint-env
      OSINT__DEDUPLICATOR__BIND: 0.0.0.0:18083
    ports:
      - "18083:18083"
    networks:
      - osint-core
    depends_on: *osint-depends
    restart: unless-stopped

  osint-entity-worker:
    build:
      <<: *osint-build
      target: osint-entity-worker
    image: osint-core/osint-entity-worker:0.1.0
    hostname: osint-entity-worker
    profiles: ["app"]
    environment:
      <<: *osint-env
      OSINT__ENTITY_WORKER__BIND: 0.0.0.0:18084
    ports:
      - "18084:18084"
    networks:
      - osint-core
    depends_on: *osint-depends
    restart: unless-stopped

  osint-indexer:
    build:
      <<: *osint-build
      target: osint-indexer
    image: osint-core/osint-indexer:0.1.0
    hostname: osint-indexer
    profiles: ["app"]
    environment:
      <<: *osint-env
      OSINT__INDEXER__BIND: 0.0.0.0:18085
    ports:
      - "18085:18085"
    networks:
      - osint-core
    depends_on: *osint-depends
    restart: unless-stopped
