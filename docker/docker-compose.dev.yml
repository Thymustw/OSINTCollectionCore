# 開發覆寫：對齊本機約 31GB RAM / 8 核心，並避開已被其他堆疊佔用的主機埠。
#
# 實測（2026-09-10）：主機 9200 已被 OpenCTI Elasticsearch 佔用、
# 9000 已被 OpenCTI MinIO 佔用。canonical 埠仍寫在 docker-compose.yml；
# 這個 override 把 OpenSearch / MinIO 改掛 19200 / 19000 / 19001。
# Postgres 5432、Redis 6379、Redpanda 9092/8081/8082/9644 主機端目前空閒，維持原埠。
# Neo4j 7474/7687 同樣空閒（2026-09-12 實測），維持原埠。
#
# 基礎建設的記憶體合計（V0.2 Phase 0a-2 後）：
#   postgres 1g + opensearch 3g + redpanda 512m + redis 256m + minio 512m + neo4j 1g
#   = 6.25 GB / 4.5 CPU
# opensearch 從 1g 升到 2g 再升到 3g 的理由見下方該服務的註解
#（0a：單一 embedding 模型；0a-2：中英雙模型並存）。
# 明細與宿主預算見 docs/architecture/RESOURCE_BUDGET.md。

services:
  postgres:
    mem_limit: 1g
    cpus: "1.0"

  # 2 GB / 1 GB heap 是 **ml-commons 的 embedding 模型要求的**，不是預留餘裕。
  #
  # 2026-09-12 實測（docs/developer/embedding.md 有完整數據）：在原本的
  # mem_limit 1g + -Xmx512m 之下，all-MiniLM-L6-v2 註冊得成功（模型檔寫進
  # volume），但 deploy 一定失敗：
  #     "Memory Circuit Breaker is open, please check your resources!"
  # 當下容器吃掉 897 MiB / 1 GiB（os.mem free 只剩 65 MB）、
  # ml_jvm_heap_usage 89 %——超過 plugins.ml_commons.jvm_heap_memory_threshold
  # 的預設 85。**這是斷路器擋下來的，不是 OOM-kill**（OOMKilled=false），
  # 所以症狀是「模型永遠 deploy 不起來」而不是容器掛掉。
  #
  # 不要只加 mem_limit 不加 heap：擋下來的是 JVM heap 那條斷路器。
  # 也不要靠調高 jvm_heap_memory_threshold 繞過——那是把 GC 壓力換成
  # 整個叢集不穩，ONNX 模型本身要的是 heap 外的 native memory。
  #
  # ---- V0.2 Phase 0a-2：再從 2g/1g heap 升到 3g/1536m heap ----
  # 因為要**同時掛兩個模型**（英文 all-MiniLM-L6-v2 + 多語 e5-small int8，
  # 「什麼語言就用什麼模型」）。2026-09-12 實測的三個失敗點：
  #
  # 1. 2g 容器塞不下第二個模型：kernel cgroup **OOM-kill**（不是斷路器）。
  #    journalctl -k 有 "Memory cgroup out of memory: Killed process ... (java)
  #    anon-rss:2080956kB"，剛好等於 2 GiB 上限。
  #    ⚠️ `docker inspect .State.OOMKilled` 這時回報 **false**，會騙人；
  #    唯一可靠的證據是 kernel journal 與 RestartCount。
  # 2. 3g 容器但維持 -Xmx1g：兩個模型都 deploy 得起來（容器才 2.0 GiB／67%），
  #    但 heap 穩定停在 86–92 %，超過 ml-commons 的
  #    jvm_heap_memory_threshold（85，這是 2.19 唯一還生效的門檻），
  #    於是**每一次推論都被擋成 HTTP 429**「Memory Circuit Breaker is open」。
  #    容器記憶體看起來很閒，真正的瓶頸是 heap——只加 mem_limit 修不好。
  # 3. e5-small 的 **FP32**（470 MB ONNX）即使在 3g/1536m 也會 OOM-kill
  #    （anon-rss 3128400kB）。所以用 int8 量化版（118 MB），實測檢索品質
  #    與 FP32 相同（中英文 top-1 各 5/5）、延遲還快一倍。
  #
  # 目前實測值：兩個模型都 DEPLOYED 時容器 2.55 GiB / 3 GiB（85 %）、
  # heap 1170/1536 MB（76 %）、斷路器觸發 0 次。
  opensearch:
    mem_limit: 3g
    cpus: "1.0"
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1536m -Xmx1536m
    ports: !override
      - "19200:9200"

  redpanda:
    mem_limit: 512m
    cpus: "1.0"

  redis:
    mem_limit: 256m
    cpus: "0.50"

  minio:
    mem_limit: 512m
    cpus: "0.50"
    ports: !override
      - "19000:9000"
      - "19001:9001"

  # 1 GB 給 512m heap + 256m pagecache，剩下約 256 MB 留給 JVM 的 metaspace、
  # 執行緒堆疊與網路緩衝。V0.2 的圖投影規模（幾十萬節點級）用不到更多。
  # 埠**不覆寫**：7474/7687 在這台機器上是空的（2026-09-12 `ss -ltn` 實測），
  # 沒有像 9200/9000 那樣的 OpenCTI 衝突要規避。
  #
  # 值與 base compose 相同是刻意重複：base 那份是給 CI 的保險
  # （Neo4j 沒設定會依可見 RAM 自動推算 heap），這份是本機的天花板。
  neo4j:
    mem_limit: 1g
    cpus: "0.50"
    environment:
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m

  # --- 應用服務（profiles: app，只有 `make compose-up-full` 會起）---
  #
  # RESOURCE_BUDGET.md §2/§3 的原則（Core 不擁有全部 CPU/RAM，要留給 VM 與
  # 宿主）套到這台開發機的實際規格：約 31 GB RAM / 8 核心，而且同時跑著
  # 一整套 OpenCTI。上面的基礎建設已經佔掉 5.25 GB / 4.5 CPU
  # （V0.2 Phase 0b 起：opensearch 1g→2g、新增 neo4j 1g），
  # 這九個服務再加約 2.6 GB / 3.25 CPU，合計約 8.85 GB / 7.75 CPU
  # （V0.2 Phase 2 Step 7 加了 osint-graph-worker；Phase 3 Step 3
  # 加了 osint-embedding-worker，推論在 OpenSearch JVM，本行程 256m/0.25；
  # Phase 4 Step 6 加了 osint-stix-worker，同樣是輕量常駐消費者 256m/0.25）。
  #
  # 分配依據：osint-api 同時是 HTTP 入口與匯入解析點，拿最多；indexer 要做
  # bulk 批次與 OpenSearch 投影，次之；graph-worker 逐筆寫 Neo4j、沒有批次，
  # 跟其餘輕量消費者同一個等級。
  #
  # ⚠️ 這些是**本機開發**的天花板，不是容量規劃。正式佈署要依
  # RESOURCE_BUDGET.md 的 OSINT_RAM_SOFT_LIMIT_GB / OSINT_CPU_SOFT_PERCENT 重算。
  #
  # 宿主埠**不覆寫**：18080–18088 在這台機器上是空的（`ss -ltn` 實測），
  # 沒有像 9200/9000 那樣的 OpenCTI 衝突要規避。

  osint-api:
    mem_limit: 512m
    cpus: "1.0"

  osint-collector:
    mem_limit: 256m
    cpus: "0.25"

  osint-normalizer:
    mem_limit: 256m
    cpus: "0.25"

  osint-deduplicator:
    mem_limit: 256m
    cpus: "0.25"

  osint-entity-worker:
    mem_limit: 256m
    cpus: "0.25"

  osint-indexer:
    mem_limit: 384m
    cpus: "0.50"

  # 逐筆寫 Neo4j，沒有 bulk API 也不累積批次——跟 entity-worker 同一個等級
  # 的輕量常駐消費者，不是 indexer 那種批次/backpressure 的角色。
  osint-graph-worker:
    mem_limit: 256m
    cpus: "0.25"

  # 推論在 OpenSearch JVM（ml-commons），本行程只是 Kafka 消費者 + HTTP
  # overlay。跟 entity-worker 同一個等級。
  osint-embedding-worker:
    mem_limit: 256m
    cpus: "0.25"

  # 逐筆寫 Postgres（一個交易內兩趟 upsert），沒有 bulk API 也不累積批次——
  # 跟 entity-worker／graph-worker 同一個等級的輕量常駐消費者。
  osint-stix-worker:
    mem_limit: 256m
    cpus: "0.25"
