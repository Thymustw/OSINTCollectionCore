[package]
name = "storage-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "SQLite EmbeddedStore + RelationalStore adapter"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
core-model = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, default-features = false, features = ["sqlite"] }
storage-core = { workspace = true }
# 交易 handle 要在 `&self` 介面下拿到 `&mut sqlx::Transaction`，需要能跨 await 持有的鎖。
tokio = { workspace = true }
uuid = { workspace = true }

[features]
# 測試專用：EventOutboxTestSupport。正式 binary 不開。
test-support = ["storage-core/test-support"]

[dev-dependencies]
# 整合測試要開 test-support，才能呼叫 assert_event_outbox_contract。
storage-sqlite = { path = ".", features = ["test-support"] }
