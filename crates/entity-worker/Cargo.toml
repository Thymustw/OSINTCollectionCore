[package]
name = "entity-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "dedup.completed → SPEC §17 entity extraction → Relationship/RelationshipEvidence（確定性規則，無 NER；冪等）"

[[bin]]
name = "osint-entity-worker"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
core-config = { workspace = true }
core-events = { workspace = true }
core-model = { workspace = true }
core-observability = { workspace = true }
# 確定性抽取規則（SPEC §17）。regex 1.13 已經在相依樹裡（tracing-subscriber 的
# env-filter 帶進來的），所以這一行不會新增任何 crate 到樹上，授權面也沒有變化。
regex = { workspace = true }
resolver = { workspace = true }
serde_json = { workspace = true }
storage-core = { workspace = true }
storage-postgres = { path = "../storage-postgres" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# URL entity 的 scheme/host 解析。正規化本身走 core_model::url_norm（同一份規則）。
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
collector = { path = "../collector" }
core-jobs = { workspace = true }
deduplicator = { path = "../deduplicator" }
normalizer = { path = "../normalizer" }
# e2e 的「claim 前 crash」情境要直接刪掉一列 provenance，那沒有（也不該有）
# RelationalStore 方法——delete_provenance 會讓溯源鏈可被抹除。測試專用。
sqlx = { workspace = true }
storage-s3 = { path = "../storage-s3" }
