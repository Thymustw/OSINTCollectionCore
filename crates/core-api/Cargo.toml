edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Axum API skeleton：health／ready／metrics、auth、RBAC、pagination"

[[bin]]
name = "osint-api"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
core-config = { workspace = true }
core-events = { workspace = true }
core-jobs = { workspace = true }
core-model = { workspace = true }
core-observability = { workspace = true }
core-security = { workspace = true }
dotenvy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
storage-core = { workspace = true }
storage-postgres = { path = "../storage-postgres" }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { workspace = true, features = ["util"] }
