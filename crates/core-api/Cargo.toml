[package]
name = "core-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Axum API skeleton：health／ready／metrics、auth、RBAC、pagination"

[[bin]]
name = "osint-api"
path = "src/main.rs"

[dependencies]
ai-gateway = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
connector-sdk = { workspace = true }
core-config = { workspace = true }
core-events = { workspace = true }
core-jobs = { workspace = true }
core-model = { workspace = true }
core-observability = { workspace = true }
core-security = { workspace = true }
dotenvy = { workspace = true }
import-format = { workspace = true }
# index mapping、欄位名常數與搜尋語法都在 indexer crate：core-api 與 osint-cli
# 都只呼叫 indexer::search::build，不自己組查詢（理由見 crates/indexer/src/lib.rs）。
indexer = { path = "../indexer" }
hex = { workspace = true }
merge = { workspace = true }
# GET /api/v1/ops/metrics 的 Disk 指標（statvfs）。見 src/ops.rs 的 disk_usage。
libc = { workspace = true }
# GET /api/v1/ops/health 的 `neo4j` 探針仍走 HTTP 7474（見 `GraphCheck`）。
# Bolt 探活是同一份清單裡的 `neo4j_bolt`（`BackendCheck` 包 `Neo4jStore`，跑 `RETURN 1`）。
# 真正的圖查詢（`POST /entities/{id}/resolve/graph-context`、`/graph/*`）也走 Bolt。
reqwest = { workspace = true }
resolver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
storage-core = { workspace = true }
storage-neo4j = { path = "../storage-neo4j" }
storage-opensearch = { path = "../storage-opensearch" }
storage-postgres = { path = "../storage-postgres" }
# 只給 GET /api/v1/ops/health 用：Redis 是 collector／worker 的節流與去重快取，
# API 自己不讀它，但運維要看得到它活著。
storage-redis = { path = "../storage-redis" }
storage-s3 = { path = "../storage-s3" }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Acceptance A/E 的完整版要真的跑一次採集→正規化→去重→抽取→索引，
# 才驗得到「真實流程產生的資料可搜尋、可回溯」（見 tests/search_api_e2e.rs）。
collector = { path = "../collector" }
deduplicator = { path = "../deduplicator" }
entity-worker = { path = "../entity-worker" }
http-body-util = "0.1.3"
normalizer = { path = "../normalizer" }
storage-s3 = { path = "../storage-s3" }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true }
