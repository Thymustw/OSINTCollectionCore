[package]
name = "chunk-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "dedup.completed → 段落切分（ADR-016 階段 5 M1）→ document_chunks → document.chunked"

[[bin]]
name = "osint-chunk-worker"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
chunker = { path = "../chunker" }
core-config = { workspace = true }
core-events = { workspace = true }
core-model = { workspace = true }
core-observability = { workspace = true }
serde_json = { workspace = true }
storage-core = { workspace = true }
storage-postgres = { path = "../storage-postgres" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# 一次性 topic namespace 與一次性 DB：e2e 不碰開發 DB、不跟執行中的服務共用 topic。
core-events = { workspace = true, features = ["test-support"] }
storage-postgres = { path = "../storage-postgres", features = ["test-support"] }
