[workspace]
resolver = "3"
members = [
    "crates/core-model",
    "crates/core-config",
    "crates/storage-core",
    "crates/storage-postgres",
    "crates/storage-sqlite",
    "crates/storage-opensearch",
    "crates/storage-redis",
    "crates/storage-s3",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
config = "0.15.25"
core-config = { path = "crates/core-config" }
core-model = { path = "crates/core-model" }
dotenvy = "0.15.7"
opensearch = { version = "2.4.0", default-features = false, features = ["rustls-tls"] }
# 1.3+ 的 rust-version 是 1.88；workspace 鎖 1.85。必須用 `=` 精確釘版，
# 否則 caret `1.2.2` 仍會解析到 1.7.0（MSRV 1.88）。
redis = { version = "=1.2.2", default-features = false, features = ["tokio-comp"] }
rust-s3 = { version = "0.37.2", default-features = false, features = ["tokio-rustls-tls", "fail-on-err"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "macros",
    "migrate",
    "chrono",
    "uuid",
    "json",
] }
storage-core = { path = "crates/storage-core" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v7", "serde"] }
