[workspace]
resolver = "3"
members = ["crates/core-model", "crates/core-config"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
config = "0.15.25"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
    "uuid",
    "json",
] }
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v7", "serde"] }
