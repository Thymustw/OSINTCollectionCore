[workspace]
resolver = "3"
members = [
    "crates/core-model",
    "crates/core-config",
    "crates/core-observability",
    "crates/core-security",
    "crates/core-events",
    "crates/core-jobs",
    "crates/core-api",
    "crates/storage-core",
    "crates/storage-postgres",
    "crates/storage-sqlite",
    "crates/storage-opensearch",
    "crates/storage-redis",
    "crates/storage-s3",
    "crates/storage-neo4j",
    "crates/connector-sdk",
    "crates/connector-rss",
    "crates/connector-static-web",
    "crates/connector-rest-api",
    "crates/import-format",
    "crates/collector",
    "crates/normalizer",
    "crates/deduplicator",
    "crates/entity-worker",
    "crates/resolver",
    "crates/ai-gateway",
    "crates/merge",
    "crates/indexer",
    "crates/graph-worker",
    "crates/embedding-worker",
    "crates/osint-cli",
    # 跨服務驗收測試（SPEC §26 Acceptance F、TEST_STRATEGY §6）。沒有生產程式碼。
    "crates/acceptance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "json",
    "multipart",
    "query",
    "tokio",
    "tracing",
] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
# 表格輸出只需要純字串排版。default-features 會帶 crossterm（終端機寬度偵測），
# 對一支唯讀查詢 CLI 是多餘的相依面，關掉。
comfy-table = { version = "8.0.0", default-features = false }
config = "0.15.25"
connector-sdk = { path = "crates/connector-sdk" }
core-config = { path = "crates/core-config" }
core-events = { path = "crates/core-events" }
core-jobs = { path = "crates/core-jobs" }
core-model = { path = "crates/core-model" }
core-observability = { path = "crates/core-observability" }
core-security = { path = "crates/core-security" }
croner = { version = "4.0.0", default-features = false, features = ["chrono"] }
csv = "1.4.0"
feed-rs = "2.4.0"
hex = "0.4.3"
import-format = { path = "crates/import-format" }
ipnet = "2.12.2"
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
# 只給 GET /api/v1/ops/metrics 的 Disk 指標用（statvfs）。std 沒有任何取得檔案系統
# 剩餘空間的 API，而 §31 Required views 明列 "CPU/RAM/Disk metrics"。
# libc 本來就已經在相依樹裡（tokio／rdkafka／sqlx 都拉它），明確宣告成 workspace
# 相依不會新增任何 crate。MIT OR Apache-2.0。
libc = { version = "0.2.180", default-features = false, features = ["std"] }
opensearch = { version = "2.4.0", default-features = false, features = ["rustls-tls"] }
rand = { version = "0.8.5", features = ["std"] }
# entity-worker 的確定性抽取規則（SPEC §17）。
# 這個版本本來就已經在相依樹裡（tracing-subscriber 的 env-filter 帶進來），
# 明確宣告成 workspace 相依不會新增任何 crate。MIT OR Apache-2.0。
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "http2",
    "charset",
] }
# 不用 cmake-build：librdkafka 的 #cmakedefine01 WITH_OAUTHBEARER_OIDC
# 在關閉時仍寫成 `#define WITH_OAUTHBEARER_OIDC 0`，C 端 `#ifdef` 仍為真，
# 因而 #include <curl/curl.h>。系統沒有 libcurl-dev。
# 改走 mklove ./configure --disable-curl --disable-ssl（本機 Redpanda 明文 9092）。
rdkafka = { version = "0.39.0", default-features = false, features = [
    "tokio",
    "libz",
] }
# default-features 關掉 `main`（getopts CLI）。只當 HTML 解析庫用。
scraper = { version = "0.27.0", default-features = false, features = ["errors"] }
# 1.3+ 的 rust-version 是 1.88；workspace 鎖 1.85。必須用 `=` 精確釘版，
# 否則 caret `1.2.2` 仍會解析到 1.7.0（MSRV 1.88）。
redis = { version = "=1.2.2", default-features = false, features = ["tokio-comp"] }
# aws feature 內建 reqwest/rustls + aws-lc-rs，不開 native-tls。default-features
# 關掉是因為 crate 預設帶 `fs`（本機檔案系統），我們只接 MinIO。
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
sha2 = "0.10.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "macros",
    "migrate",
    "chrono",
    "uuid",
    "json",
] }
storage-core = { path = "crates/storage-core" }
ai-gateway = { path = "crates/ai-gateway" }
# 穩定版。不要用 0.9.0-rc*：RC 的 API／MSRV 會漂，workspace 鎖 1.85。
neo4rs = "0.8.0"
resolver = { path = "crates/resolver" }
merge = { path = "crates/merge" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "net", "sync", "signal"] }
tower = { version = "0.5.3", features = ["limit", "util"] }
tower-http = { version = "0.6.11", features = [
    "trace",
    "timeout",
    "limit",
    "cors",
    "catch-panic",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v5", "v7", "serde"] }
