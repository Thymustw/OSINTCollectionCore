name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Gate order: lint -> secret scan -> SCA -> IaC scan -> unit -> integration -> build.
#
# No continue-on-error anywhere: a green run must mean the gate actually
# passed. This file is intentionally NOT pushed to the remote until the
# Cargo workspace exists — pushing it against an empty workspace would force a
# choice between "red from commit one" and "continue-on-error everywhere," and
# the latter turns the gate into decoration once real code lands.

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    name: Dependency audit (cargo-audit + cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo audit
      - run: cargo deny check

  iac-scan:
    name: Docker/IaC scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: trivy config scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: docker/
          exit-code: "1"

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --lib

  integration-test:
    name: Integration tests (full stack via docker-compose)
    runs-on: ubuntu-latest
    needs: [unit-test]
    # Runs the same docker/docker-compose.yml used locally, on its canonical
    # ports (9200/9000/9001/...) — CI runners don't have the local-dev-machine
    # OpenCTI port conflict that docker-compose.dev.yml works around, so the
    # override file is deliberately NOT used here.
    #
    # NOTE: this job has not yet been validated by an actual push (see the
    # conversation/commit history) — the docker-compose file's own healthchecks
    # and `--wait` are expected to work on GitHub's ubuntu-latest runners, but
    # that is an expectation, not something already observed passing in CI.
    env:
      DATABASE_URL: postgres://osint:osint_dev@localhost:5432/osint_core
      SQLITE_URL: "sqlite:./var/osint-local.sqlite?mode=rwc"
      OPENSEARCH_URL: http://localhost:9200
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: raw-evidence
      MINIO_ROOT_USER: osint
      MINIO_ROOT_PASSWORD: osint_dev_minio
      REDIS_URL: redis://localhost:6379/0
      REDPANDA_BROKERS: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@sqlx-cli
      - name: Start infrastructure
        run: docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 180
      - run: mkdir -p var
      - run: sqlx migrate run --source migrations/postgres --database-url "$DATABASE_URL"
      - run: sqlx migrate run --source migrations/sqlite --database-url "$SQLITE_URL"
      - run: cargo nextest run --workspace --all-targets
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs
      - name: Stop infrastructure
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [unit-test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
