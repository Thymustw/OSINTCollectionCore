name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Gate order: lint -> secret scan -> SCA -> IaC scan -> unit -> integration ->
#             build -> image-build -> sbom + image-scan.
#
# 對應 docs/security/SECURITY_CI.md 的 "Build Candidate" 段
# （container build → SBOM generation → image scan）與 DEVSECOPS.md §12。
#
# No continue-on-error anywhere: a green run must mean the gate actually
# passed. This file is intentionally NOT pushed to the remote until the
# Cargo workspace exists — pushing it against an empty workspace would force a
# choice between "red from commit one" and "continue-on-error everywhere," and
# the latter turns the gate into decoration once real code lands.

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # SPEC §30 Acceptance 1「committed secret detection is tested」：先證明
      # 掃描器真的抓得到東西，再掃真正的 repo。canary 在 $RUNNER_TEMP 的獨立
      # git repo 裡，字串在 scripts/secret-scan-canary.sh 內拆開組合，不會
      # 以完整形式出現在本 repo 任何 commit。
      #
      # gitleaks-action 沒有提供 binary 給後續 step 用，所以這裡自己抓一份
      # 跟 action 同一個 release 的 binary。版本 pin 在 GITLEAKS_VERSION。
      - name: Install gitleaks for canary
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Secret-scan canary (scanner must detect a planted fake key)
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
          TMPDIR: ${{ runner.temp }}
        run: bash scripts/secret-scan-canary.sh
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    name: Dependency audit (cargo-audit + cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo audit
      - run: cargo deny check

  iac-scan:
    name: Docker/IaC scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: docker/
          exit-code: "1"

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --lib

  integration-test:
    name: Integration tests (full stack via docker-compose)
    runs-on: ubuntu-latest
    needs: [unit-test]
    # Runs the same docker/docker-compose.yml used locally, on its canonical
    # ports (9200/9000/9001/...) — CI runners don't have the local-dev-machine
    # OpenCTI port conflict that docker-compose.dev.yml works around, so the
    # override file is deliberately NOT used here.
    #
    # Validated on real runners: this file is exported to the public repo
    # (github.com/Thymustw/OSINTCollectionCore, see docs/adr/ADR-003) and has
    # run there on ubuntu-latest on every push since 2026-09-10 — 15+ green
    # runs as of 2026-09-12. The private repo deliberately has NO git remote
    # (ADR-003), so `git remote -v` being empty here says nothing about
    # whether CI runs. A prior doc-sync pass misread that and rewrote this
    # comment to "never executed"; corrected. Observed `--wait` time on the
    # runner is well under the 180s ceiling (typically 60–110s).
    #
    # Memory budget (V0.2 phase 0b added Neo4j as a 6th infrastructure
    # service). Per GitHub's hosted-runner docs (re-checked 2026-09-12),
    # `ubuntu-latest` on PUBLIC repositories is 4 vCPU / 16 GB RAM / 14 GB SSD
    # — not the 7 GB an earlier note assumed. Configured ceilings here:
    #   postgres shared_buffers 256M, opensearch heap 512M,
    #   redpanda 256M, redis 192M, minio small, neo4j heap 512M + pagecache 256M
    # ≈ 2 GB of declared limits, leaving ample headroom for the cargo build.
    # NOTE: docker-compose.yml carries no `mem_limit` (those live in the dev
    # override), so these are per-process heap settings, not cgroup caps.
    # Neo4j's heap/pagecache are therefore set in the BASE compose file on
    # purpose: unset, Neo4j sizes its heap from visible RAM and would take far
    # more than it needs here.
    #
    # `--wait` now covers 6 services. Neo4j's healthcheck has a 40s
    # start_period (measured ~20-30s to first HTTP 200 locally), still well
    # inside the 180s ceiling.
    env:
      DATABASE_URL: postgres://osint:osint_dev@localhost:5432/osint_core
      SQLITE_URL: "sqlite:./var/osint-local.sqlite?mode=rwc"
      OPENSEARCH_URL: http://localhost:9200
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: raw-evidence
      MINIO_ROOT_USER: osint
      MINIO_ROOT_PASSWORD: osint_dev_minio
      REDIS_URL: redis://localhost:6379/0
      REDPANDA_BROKERS: localhost:9092
      # Neo4j (V0.2 phase 0b). Canonical ports; the local-dev override does not
      # remap them because 7474/7687 are free on the dev workstation too.
      # NEO4J_USER must stay `neo4j`: Community Edition cannot create a
      # differently-named initial user via NEO4J_AUTH, and it fails silently
      # (the container starts, the login just never works).
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: osint_dev_neo4j
      NEO4J_URI: bolt://localhost:7687
      OSINT__STORAGE__GRAPH__HTTP_URL: http://localhost:7474
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # taiki-e/install-action has no sqlx-cli tag — that shorthand only works
      # for tools it actually publishes prebuilt binaries for.
      # Re-confirmed 2026-09-12 via the GitHub contents API: none of the 103
      # entries in taiki-e/install-action's manifests/ directory is sqlx.
      # Build from source instead, pinned
      # to the exact features used locally (postgres+sqlite+rustls, no
      # native-tls/openssl).
      - run: cargo install sqlx-cli --version =0.9.0 --locked --no-default-features --features postgres,sqlite,rustls
      - name: Start infrastructure
        run: docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 180
      - run: mkdir -p var
      - run: sqlx migrate run --source migrations/postgres --database-url "$DATABASE_URL"
      - run: sqlx migrate run --source migrations/sqlite --database-url "$SQLITE_URL"
      - run: cargo nextest run --workspace --all-targets
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs
      - name: Stop infrastructure
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [unit-test]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release

  # ==========================================================================
  # Build Candidate 段（SECURITY_CI.md）：container build -> SBOM -> image scan
  # ==========================================================================

  image-build:
    name: Container build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        service:
          - osint-api
          - osint-collector
          - osint-normalizer
          - osint-deduplicator
          - osint-entity-worker
          - osint-indexer
          - osint-graph-worker
          - osint-embedding-worker
          - osint-stix-worker
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # 九個 target 共用同一個 builder stage。GHA cache 讓第二個之後的
      # service 直接命中，不會把同一份 workspace 編八次。
      #
      # 產出存成 tar 給 sbom / image-scan job 用。分成不同 job 是為了讓
      # DEVSECOPS §12 的 gate 在 CI 上各自可見（哪一關擋下來一目了然），
      # 不是為了讓它們各自重編一次。
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.service }}
          tags: osint-core/${{ matrix.service }}:ci
          push: false
          load: false
          outputs: type=docker,dest=/tmp/${{ matrix.service }}.tar
          cache-from: type=gha,scope=osint-core-builder
          cache-to: type=gha,mode=max,scope=osint-core-builder
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  sbom:
    name: SBOM (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [image-build]
    strategy:
      fail-fast: false
      matrix:
        service:
          - osint-api
          - osint-collector
          - osint-normalizer
          - osint-deduplicator
          - osint-entity-worker
          - osint-indexer
          - osint-graph-worker
          - osint-embedding-worker
          - osint-stix-worker
    steps:
      # V0.1 只要求「有產生路徑」（DEVSECOPS.md §25：正式 SBOM 是 V1.0 的
      # release gate）。這裡用 trivy 而不是 syft，理由是 SECURITY_CI.md 的
      # 「Avoid unnecessary tool sprawl」——image scan 已經需要 trivy，
      # 同一支工具就能出 CycloneDX，不必為此再引進第二個掃描器。
      #
      # 這個 job **不擋**任何東西：它只產生 artifact。真正的 gate 是 image-scan。
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp
      - run: docker load --input /tmp/${{ matrix.service }}.tar
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: osint-core/${{ matrix.service }}:ci
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json
          exit-code: "0"
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json
          retention-days: 30

  # ADR-010 の SBOM 缺口：Neo4j 是外部 registry image（不是本 repo build 出來
  # 的），所以不能跟其他九個服務共用 image-build → download-artifact 那條路
  # （那套是為了掃描本 repo 自建 image 的 tar 產物）。直接 pull 官方 image
  # 後用同一套 trivy 流程掃，理由與範圍見
  # docs/adr/ADR-010-neo4j-community-edition.md Consequences 段落。
  sbom-neo4j:
    name: SBOM + scan (neo4j)
    runs-on: ubuntu-latest
    steps:
      - run: docker pull neo4j:5.26.30-community
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: neo4j:5.26.30-community
          format: cyclonedx
          output: sbom-neo4j.cdx.json
          exit-code: "0"
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-neo4j
          path: sbom-neo4j.cdx.json
          retention-days: 30
      # 兩段式，跟下面 image-scan 的 osint-core/* 服務同一套規矩
      # （HIGH 列出來分流、CRITICAL 擋）。
      - name: HIGH findings (triage list, non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: neo4j:5.26.30-community
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"
      - name: CRITICAL gate (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: neo4j:5.26.30-community
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  image-scan:
    name: Image scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [image-build]
    strategy:
      fail-fast: false
      matrix:
        service:
          - osint-api
          - osint-collector
          - osint-normalizer
          - osint-deduplicator
          - osint-entity-worker
          - osint-indexer
          - osint-graph-worker
          - osint-embedding-worker
          - osint-stix-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp
      - run: docker load --input /tmp/${{ matrix.service }}.tar
      # 兩段式，對齊 DEVSECOPS.md §13：
      #   Critical → 擋（"unresolved Critical security finding ... blocks"）
      #   High     → 列出來分流（"High findings require explicit triage"），不擋
      #
      # ⚠️ 這與「HIGH,CRITICAL 一律 exit-code 1」不同，是刻意的。runtime base
      # 是 debian:bookworm-slim，distro 套件常年帶著上游沒修的 HIGH；一律擋的
      # 結果是所有人把它們塞進 .trivyignore，gate 就退化成裝飾品。
      #
      # --ignore-unfixed：上游還沒出修補版的，擋了也沒有下一步動作可做。
      #
      # 若真的需要 .trivyignore，每一個 ID **必須**在
      # docs/security/VULNERABILITY_TRIAGE.md 有對應條目（跟 deny.toml 的
      # advisories ignore 同一套規矩），沒有對應條目就是流程違規。
      - name: HIGH findings (triage list, non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: osint-core/${{ matrix.service }}:ci
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"
      - name: CRITICAL gate (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: osint-core/${{ matrix.service }}:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
